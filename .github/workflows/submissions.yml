name: Credit replay submissions
on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Coordinate replay claims]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['evidence/volunteers/**', 'tracker/submissions.py', 'tracker/claim_comments.py', 'tracker/activity.py', 'tracker/credit_commit.py', '.github/workflows/submissions.yml']
permissions:
  contents: write
  issues: read
concurrency:
  group: replay-submission-credits
  cancel-in-progress: false
jobs:
  update:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'issue_comment'
      || (!github.event.issue.pull_request && github.event.comment.user.login == github.event.issue.user.login))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update the README from claim submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach FETCH_HEAD
            python3 tracker/submissions.py --issue-authors "$RUNNER_TEMP/issue-authors.json"
            python3 tracker/activity.py
            git add README.md tracker/activity.tsv tracker/activity.svg
            if git diff --cached --quiet; then exit 0; fi
            python3 tracker/credit_commit.py "$RUNNER_TEMP/issue-authors.json" > "$RUNNER_TEMP/credit-message"
            git commit -F "$RUNNER_TEMP/credit-message"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
